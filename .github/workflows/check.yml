name: Check site
on:
  pull_request:
    branches-ignore: [site-data]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist
          retention-days: 7
